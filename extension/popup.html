<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Shield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ── HEADER ─────────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="brand">
      <svg class="shield-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 6.5V11C3 15.55 6.84 19.74 12 21C17.16 19.74 21 15.55 21 11V6.5L12 2Z" fill="url(#shieldGrad)"
          stroke="url(#shieldStroke)" stroke-width="0.5" />
        <path d="M9 12l2 2 4-4" stroke="#00f5d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        <defs>
          <linearGradient id="shieldGrad" x1="3" y1="2" x2="21" y2="21" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0a1628" />
            <stop offset="1" stop-color="#0f2a3d" />
          </linearGradient>
          <linearGradient id="shieldStroke" x1="3" y1="2" x2="21" y2="21" gradientUnits="userSpaceOnUse">
            <stop stop-color="#00f5d4" />
            <stop offset="1" stop-color="#0ea5e9" />
          </linearGradient>
        </defs>
      </svg>
      <span class="brand-name">AI<span class="brand-accent">Shield</span></span>
    </div>
    <div class="header-right">
      <div id="backendStatus" class="status-badge status-checking">
        <span class="status-dot"></span>
        <span class="status-text">Checking…</span>
      </div>
    </div>
  </header>

  <!-- ── TABS ───────────────────────────────────────────────────────────── -->
  <nav class="tab-nav" role="tablist">
    <button class="tab-btn active" data-tab="text" role="tab" aria-selected="true">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z"
          clip-rule="evenodd" />
      </svg>
      <span>Text</span>
    </button>
    <button class="tab-btn" data-tab="image" role="tab" aria-selected="false">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z"
          clip-rule="evenodd" />
      </svg>
      <span>Image</span>
    </button>
    <button class="tab-btn" data-tab="phishing" role="tab" aria-selected="false">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
          clip-rule="evenodd" />
      </svg>
      <span>Phishing</span>
    </button>
    <button class="tab-btn" data-tab="history" role="tab" aria-selected="false">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd"
          d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4l3 3a1 1 0 001.414-1.414L11 9.586V6z"
          clip-rule="evenodd" />
      </svg>
      <span>History</span>
    </button>
  </nav>

  <main class="app-body">

    <!-- ── TEXT TAB ─────────────────────────────────────────────────────── -->
    <section id="tab-text" class="tab-panel active" role="tabpanel">
      <div class="toolbar">
        <button id="grabTextBtn" class="chip-btn">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <path d="M10.5 8a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z" />
            <path d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8zm8 3.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" />
          </svg>
          Extract from page
        </button>
        <button id="scanUrlBtn" class="chip-btn">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <path
              d="M4.715 6.542L3.343 7.914a3 3 0 104.243 4.243l1.828-1.829A3 3 0 008.586 5.5L8 6.086a1.002 1.002 0 00-.154.199 2 2 0 01.861 3.337L6.88 11.45a2 2 0 11-2.83-2.83l.793-.792a4.018 4.018 0 01-.128-1.287z" />
            <path
              d="M6.586 4.672A3 3 0 007.414 9.5l.775-.776a2 2 0 01-.896-3.346L9.12 3.55a2 2 0 112.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 10-4.243-4.243L6.586 4.672z" />
          </svg>
          Scan current URL
        </button>
      </div>
      <div class="input-wrapper">
        <textarea id="textInput" rows="6" placeholder="Paste article, essay, or any text to check for AI authorship…"
          spellcheck="false"></textarea>
        <div class="input-meta">
          <span id="textWordCount" class="word-count">0 meaningful words</span>
          <span class="char-hint">Need 50+ meaningful words for reliable detection</span>
        </div>
      </div>
      <button id="scanTextBtn" class="scan-btn">
        <span class="btn-label">Analyze Text</span>
        <span class="btn-arrow">→</span>
      </button>
      <div id="textResult" class="result-zone"></div>
    </section>

    <!-- ── IMAGE TAB ────────────────────────────────────────────────────── -->
    <section id="tab-image" class="tab-panel" role="tabpanel">
      <div style="text-align: right; margin-bottom: 8px;">
        <button id="openFullTabBtn" class="ghost-btn"
          style="font-size: 11px; padding: 4px 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px;"
          title="Open in dedicated tab for easier drag-and-drop">
          <svg viewBox="0 0 20 20" fill="currentColor" style="width: 12px; height: 12px;">
            <path
              d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z" />
            <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z" />
          </svg>
          Pop out to full tab
        </button>
      </div>
      <div class="drop-zone" id="dropZone">
        <input type="file" id="imageInput" accept="image/*">
        <div class="drop-inner" id="dropInner">
          <svg class="drop-icon" viewBox="0 0 48 48" fill="none">
            <rect x="4" y="8" width="40" height="32" rx="4" stroke="currentColor" stroke-width="2" />
            <circle cx="17" cy="19" r="3" stroke="currentColor" stroke-width="2" />
            <path d="M4 32l10-10 8 8 6-6 16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <p class="drop-label">Drop an image or <label for="imageInput" class="drop-link">browse</label></p>
          <p class="drop-hint">JPEG · PNG · WebP · max 10 MB</p>
        </div>
        <div class="image-preview hidden" id="imagePreview">
          <img id="previewImg" src="" alt="Preview">
          <button class="clear-img" id="clearImgBtn" title="Remove">✕</button>
        </div>
      </div>
      <button id="scanImageBtn" class="scan-btn" disabled>
        <span class="btn-label">Analyze Image</span>
        <span class="btn-arrow">→</span>
      </button>
      <div id="imageResult" class="result-zone"></div>
    </section>

    <!-- ── PHISHING TAB ──────────────────────────────────────────────────── -->
    <section id="tab-phishing" class="tab-panel" role="tabpanel">
      <div class="input-wrapper">
        <textarea id="phishInput" rows="6"
          placeholder="Paste a suspicious email, SMS, URL, or message to check for phishing…"
          spellcheck="false"></textarea>
      </div>
      <button id="scanPhishBtn" class="scan-btn">
        <span class="btn-label">Analyze for Phishing</span>
        <span class="btn-arrow">→</span>
      </button>
      <div id="phishResult" class="result-zone"></div>
    </section>

    <!-- ── HISTORY TAB ───────────────────────────────────────────────────── -->
    <section id="tab-history" class="tab-panel" role="tabpanel">
      <div class="history-header">
        <span class="section-label">Recent Scans</span>
        <button id="clearHistoryBtn" class="ghost-btn">Clear all</button>
      </div>
      <div id="historyList" class="history-list">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <p>No scans yet</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="app-footer">
    <span>Local-first · No data leaves your machine</span>
    <span class="footer-dot">·</span>
    <span id="modelsLoaded">Models loading…</span>
  </footer>

  <script src="popup.js"></script>
</body>

</html>
